<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- Khatam 8-point star (Rub el Hizb): 2 square rotated 45deg, stroke only.
       Match logo IKADI: gold star outline, sharp corners, no round. -->
  <g fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="miter" stroke-miterlimit="10">
    <rect x="22" y="22" width="36" height="36"/>
    <rect x="22" y="22" width="36" height="36" transform="rotate(45 40 40)"/>
    <rect x="29" y="29" width="22" height="22"/>
    <rect x="29" y="29" width="22" height="22" transform="rotate(45 40 40)"/>
    <circle cx="40" cy="40" r="3.5"/>
  </g>
</svg>
