<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Tile seamless khatam: 2 star per tile, saling mengunci di tepi. -->
  <g fill="none" stroke="currentColor" stroke-width="0.8" stroke-linejoin="miter" stroke-miterlimit="10">
    <rect x="25" y="25" width="50" height="50"/>
    <rect x="25" y="25" width="50" height="50" transform="rotate(45 50 50)"/>
    <rect x="34" y="34" width="32" height="32"/>
    <rect x="34" y="34" width="32" height="32" transform="rotate(45 50 50)"/>
    <!-- sudut tile: setengah star untuk seamless -->
    <path d="M0 0 L14 0 L0 14 Z"/>
    <path d="M100 0 L86 0 L100 14 Z"/>
    <path d="M0 100 L14 100 L0 86 Z"/>
    <path d="M100 100 L86 100 L100 86 Z"/>
  </g>
</svg>
